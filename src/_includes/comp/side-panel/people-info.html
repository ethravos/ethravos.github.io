<table>
    <caption>{{ quote }}</caption>
    <tbody>
        <tr>
            <div class="side__image">
                <img src="{{ image }}" alt="{{ title }}">
            </div>
        </tr>
        <tr><th>Name</th><td>{{ title }}</td></tr>
        <tr><th>Aliases</th><td>{{ aliases }}</td></tr>
        <tr><th>Age</th><td>{{ age }}</td></tr>
        <tr><th>Location Origin</th><td>{{ origin }}</td></tr>
        <tr><th>Organization(s)</th><td>{{ organizations }}</td></tr>
        <tr><th>Class</th><td>{{ class }}</td></tr>
        <tr><th>Other Notes</th><td>{{ other_notes }}</td></tr>
    </tbody>
    <tfoot></tfoot>
</table>
