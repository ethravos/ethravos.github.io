<div class="card-wrapper">
  <div class="card">
    <div class="card__image">
      <img src="{{ card-img }}" alt="">
    </div>
    <div class="card__info">
      <div class="info__label">{{ card-label }}</div>
      <div class="info__desc">{{ card-desc }}</div>
      <div class="info__button">
        <button>{{ card-link }}</button>
      </div>
    </div>
  </div>
</div>
